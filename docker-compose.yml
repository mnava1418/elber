# Elber's backend in containers, behind Caddy for HTTPS. The web is not here:
# it is deployed on Vercel.
#   docker compose up -d --build
services:
  backend:
    build: ./backEnd
    env_file: ./backEnd/.env
    # Paths inside the container; the host paths in backEnd/.env don't exist here.
    environment:
      PORT: 3000
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/service_account
      OBSIDIAN_VAULT_PATH: /vault
    secrets:
      - service_account
    volumes:
      # The memory writes here: the same vault Obsidian shows on the Mac.
      - ${ELBER_VAULT_PATH:?Set ELBER_VAULT_PATH in .env (see .env.example)}:/vault
      # The agent's sessions, so conversations keep their context across rebuilds.
      - agent-sessions:/home/node/.elber/agent
    # No published ports: only Caddy reaches it, over the compose network.
    restart: unless-stopped

  caddy:
    image: caddy:2.8.4
    environment:
      ELBER_API_DOMAIN: ${ELBER_API_DOMAIN:?Set ELBER_API_DOMAIN in .env (see .env.example)}
    ports:
      # 80 too: Let's Encrypt validates the domain over it, and Caddy
      # redirects plain HTTP to HTTPS.
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # The certificates, so a restart doesn't request new ones (Let's Encrypt
      # has rate limits).
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - backend
    restart: unless-stopped

secrets:
  service_account:
    file: ./backEnd/creds/service-account.json

volumes:
  agent-sessions:
  caddy-data:
  caddy-config:
