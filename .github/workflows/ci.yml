name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

# Cancel a previous run of the same PR when new commits are pushed.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backEnd
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: backEnd/.nvmrc
          cache: npm
          cache-dependency-path: backEnd/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Architecture rules
        run: npm run lint:arch

      - name: Typecheck (src + test)
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      # tsc -b && vite build: typechecks the app and makes sure it bundles.
      - name: Typecheck + build
        run: npm run build

  mobile:
    name: Mobile
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: mobile/.nvmrc
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      # Native builds (iOS/Android) run on EAS, not here: this checks the JS bundle compiles.
      - name: Bundle
        run: npx expo export --platform ios --platform android --output-dir /tmp/expo-export
