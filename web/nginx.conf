server {
    listen 80;
    root /usr/share/nginx/html;

    # Vite's assets have a hash in their name: safe to cache for good.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # React Router handles the routes (/chat/..., /login): unknown paths get
    # index.html instead of a 404. Not cached, so a rebuild shows up at once.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
